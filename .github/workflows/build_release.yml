name: Desktop build and release

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            gradle: ./gradlew
          - os: windows-2025
            platform: windows-x64
            gradle: ./gradlew.bat
          - os: macos-15
            platform: macos-arm64
            gradle: ./gradlew
          - os: macos-15-intel
            platform: macos-x64
            gradle: ./gradlew
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: Test and package
        shell: pwsh
        run: ${{ matrix.gradle }} --no-daemon :common:build :v16:build :v16:packageDistributionForCurrentOS
      - name: Name installers
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' v16/build.gradle.kts)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
          mkdir -p installers
          files=(v16/build/compose/binaries/main/{deb,rpm,exe,dmg}/*.{deb,rpm,exe,dmg})
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            cp "$file" "installers/EVCharge-OCPP-Emulator-$version-$PLATFORM.${file##*.}"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}
          path: installers/
          if-no-files-found: error

  release:
    name: Publish installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: installers
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --verify-tag --generate-notes --title "EVCharge OCPP Emulator $GITHUB_REF_NAME"
